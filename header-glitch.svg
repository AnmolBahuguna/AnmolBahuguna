<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Anmol Bahuguna - glitch header" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.5" fill="#fff" opacity="0.06"/></pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="type"><rect x="60" y="180" width="0" height="40">
      <animate attributeName="width" values="0;880;880;0" keyTimes="0;0.35;0.92;1" dur="11s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="card"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#07060f"/>
    <rect width="1000" height="300" fill="url(#scan)"/>
    <rect y="-60" width="1000" height="60" fill="url(#beam)"><animate attributeName="y" values="-60;300" dur="5s" repeatCount="indefinite"/></rect>

    <g font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="78" font-weight="900" letter-spacing="3" text-anchor="middle">
      <text x="500" y="140" fill="#22d3ee" opacity="0.85">ANMOL BAHUGUNA
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-9 0;7 -2;-5 2;0 0;0 0" keyTimes="0;0.74;0.76;0.78;0.80;0.82;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="140" fill="#f43f5e" opacity="0.85">ANMOL BAHUGUNA
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;9 0;-7 2;5 -2;0 0;0 0" keyTimes="0;0.74;0.76;0.78;0.80;0.82;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="140" fill="#ffffff">ANMOL BAHUGUNA
        <animate attributeName="opacity" values="1;1;0.55;1;0.8;1;1" keyTimes="0;0.74;0.76;0.78;0.80;0.82;1" dur="4s" repeatCount="indefinite"/>
      </text>
    </g>

    <g clip-path="url(#type)">
      <text x="60" y="208" font-family="'Courier New',Consolas,monospace" font-size="18" fill="#a78bfa">&gt; UX-minded full-stack dev // creative engineer // 5x national hackathon finalist</text>
    </g>

    <g font-family="'Courier New',Consolas,monospace" font-size="12" fill="#8b85c1">
      <circle cx="40" cy="36" r="5" fill="#4ade80"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
      <text x="54" y="40">SYS.ONLINE</text>
      <text x="960" y="40" text-anchor="end">LAT 30.3165 N // LON 78.0322 E</text>
      <text x="40" y="272">BUILD v5.0 // 5x NATIONAL FINALIST</text>
      <text x="960" y="272" text-anchor="end" fill="#4ade80">OPEN FOR FREELANCE + COLLABS</text>
    </g>
    <g fill="none" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.7">
      <path d="M16 46V16H46"/><path d="M954 16H984V46"/><path d="M16 254V284H46"/><path d="M954 284H984V254"/>
    </g>
  </g>
</svg>
