    <text x="24" y="158" fill="#e9e5ff" opacity="0">[ <tspan fill="#27c93f">OK</tspan> ] 5 national finals loaded · IIT Bombay · IIT Guwahati · IIIT Delhi<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.30;0.32;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="24" y="184" fill="#e9e5ff" opacity="0">[ <tspan fill="#27c93f">OK</tspan> ] mounting React · Next.js · Python · Flask · FastAPI<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.44;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="24" y="210" fill="#e9e5ff" opacity="0">[ <tspan fill="#27c93f">OK</tspan> ] compiling messy ideas into clean interfaces<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.54;0.56;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="24" y="236" fill="#e9e5ff" opacity="0">[ <tspan fill="#ffbd2e">..</tspan> ] loading coffee ☕ ... <tspan fill="#27c93f">done</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.68;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="24" y="262" fill="#e9e5ff" opacity="0">[ <tspan fill="#27c93f">OK</tspan> ] status: <tspan fill="#a78bfa">open for freelance &amp; collabs</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.80;1" dur="14s" repeatCount="indefinite"/></text>
